  manifest:
    needs:
      - build-linux-containers
    runs-on: ubuntu-latest
    name: Create Multi-Arch Manifest
    strategy:
      matrix:
        library:
          - aws-lc
#          - libressl
#          - openssl
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine Image Version
        run: |
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')
          [ "$VERSION" == "main" ] && VERSION=latest
          echo "VERSION=${VERSION}-${{ matrix.library }}" >> $GITHUB_ENV
      - name: Create and push multi-arch manifest
        run: |
          IMAGE=ghcr.io/${{ github.repository }}

          # Create manifest for library tag (e.g. :aws-lc)
          docker manifest create ${IMAGE}:${{ matrix.library }} \
            ${IMAGE}:${{ matrix.library }}-amd64 \
            ${IMAGE}:${{ matrix.library }}-arm64
          docker manifest push ${IMAGE}:${{ matrix.library }}

          # Create manifest for versioned tag (e.g. :1.0.0-aws-lc)
          docker manifest create ${IMAGE}:${{ env.VERSION }} \
            ${IMAGE}:${{ env.VERSION }}-amd64 \
            ${IMAGE}:${{ env.VERSION }}-arm64
          docker manifest push ${IMAGE}:${{ env.VERSION }}

  release:
    needs:
#      - build-freebsd
      - build-linux-containers
      - manifest
    runs-on: ubuntu-latest
    name: Create Release
    steps:
      - name: Checkout from GitHub
        uses: actions/checkout@v6
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          pattern: nginx-*
      - name: Release Text
        shell: bash
        run: |
          platforms=("linux-amd64" "linux-arm64")
          #libraries=("aws-lc" "libressl" "openssl")
          libraries=("aws-lc")

          git log -1 --no-merges --pretty=%B > ./release.txt

          echo "#### Versions:" >> ./release.txt

          for library in ${libraries[@]}; do
            echo " - nginx-${library}" >> ./release.txt
            echo "    \`$(cat ./version.txt)\`" >> ./release.txt
          done

          #echo " - nginx-freebsd" >> ./release.txt
          #echo "    \`$(cat ./nginx-freebsd/version.txt)\`" >> ./release.txt

          echo "#### SHA256 Checksums:" >> ./release.txt

          for library in ${libraries[@]}; do
            for platform in ${platforms[@]}; do
              echo "    nginx-${library}-${platform}.tar.xz: $(sha256sum ./nginx-http3-${library}-${platform}.tar.xz | cut -d ' ' -f 1)" >> ./release.txt
            done

            echo "" >> ./release.txt
          done

          #echo "    nginx-aws-lc-freebsd-amd64.tar.xz: $(sha256sum ./nginx-freebsd/nginx-http3-aws-lc-freebsd-amd64.tar.xz | cut -d ' ' -f 1)" >> ./release.txt
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ./release.txt
          files: |
            ./nginx-http3-aws-lc-linux-amd64.tar.xz
            ./nginx-http3-aws-lc-linux-arm64.tar.xz
#            ./nginx-libressl/nginx-http3-libressl-linux-amd64.tar.xz
#            ./nginx-libressl/nginx-http3-libressl-linux-arm64.tar.xz
#            ./nginx-openssl/nginx-http3-openssl-linux-amd64.tar.xz
#            ./nginx-openssl/nginx-http3-openssl-linux-arm64.tar.xz
#            ./nginx-freebsd/nginx-http3-aws-lc-freebsd-amd64.tar.xz
      - name: Remove old packages
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'nginx-http3'
          package-type: 'container'
          min-versions-to-keep: 10
